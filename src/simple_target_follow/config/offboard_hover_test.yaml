# Conservative first-flight profile. Height is relative to the PX4 local Z
# captured immediately after OFFBOARD arming.
takeoff_height: 1.2
hover_duration: 40.0
takeoff_speed: 0.25
setpoint_rate: 20.0
position_tolerance: 0.12
settle_time: 1.5

# Preflight localization must be continuously quiet before start is accepted.
preflight_stable_time: 3.0
maximum_preflight_drift: 0.10
pose_max_age: 0.5
state_max_age: 3.0
estimator_max_age: 0.5
bridge_max_age: 1.0
bridge_progress_max_age: 1.0
battery_max_age: 3.0

# Existing six-cell aircraft baseline.
minimum_battery_voltage: 21.0
minimum_battery_percentage: 0.15

priming_duration: 2.0
command_timeout: 20.0
landing_timeout: 90.0
landing_mode_timeout: 5.0

# A disturbance is recorded above 0.15 m and recovered after returning inside
# 0.12 m for settle_time. The larger limits abort the mission to AUTO.LAND.
disturbance_threshold: 0.15
recovery_threshold: 0.12
maximum_horizontal_error: 0.80
maximum_hover_vertical_error: 0.40
